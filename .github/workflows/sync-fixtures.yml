name: Sync fixtures & settle points

# Polls the production sync-fixtures endpoint every 30 min year-round so results
# across domestic leagues and continental competitions settle promptly. The
# Vercel Hobby plan caps crons at once/day, hence this free GitHub Actions
# schedule. No app secrets beyond CRON_SECRET (a repo Actions secret, same value
# as the Vercel env var). The route is idempotent — safe to re-run.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync
        run: |
          # -f: non-zero exit on HTTP error so failed syncs surface as red runs.
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://fanbrainai.vercel.app/api/admin/sync-fixtures | tee response.json
          echo "Sync response logged above."
